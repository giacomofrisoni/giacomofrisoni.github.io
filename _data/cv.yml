cv:
  name: Giacomo Frisoni
  label: Postdoctoral Researcher in Natural Language Processing
  email: giacomo.frisoni@unibo.it
  location: Cesena (FC), Italy
  website: https://www.unibo.it/sitoweb/giacomo.frisoni/en
  summary: >
    Giacomo Frisoni, Ph.D., is a postdoctoral researcher in Computer Science and Engineering at the
    University of Bologna. His research interests lie in Natural Language Processing, Large Language
    Models, and Graph Neural Networks, particularly for medical applications. He has co-authored over
    30 papers in prestigious conferences and journals, including ACL, NAACL, EMNLP, and AAAI, receiving
    best paper and reviewer awards. He has actively contributed to the research community by serving in
    various scientific roles, including editorial board member, program committee member, area chair,
    and workshop organizer for many international venues. He has collaborated with esteemed academic and
    industrial institutions, including the University of Glasgow, IBM Research, EURECOM, and the
    University of Edinburgh. He served as an adjunct professor and tutor for multiple AI courses at the
    University of Bologna, co-supervising over 55 theses.

  sections:
    Education:
      - institution: University of Bologna
        location: Cesena, Italy
        url: https://www.unibo.it/
        area: Computer Science and Engineering
        studyType: Ph.D.
        start_date: 2020
        end_date: 2024
        highlights:
          - "Ministerial scholarship; ranked first out of 132 candidates in the competitive call."
          - "Supervisor: Gianluca Moro; tutors: Antonella Carbonaro and Ilaria Bartolini."
          - "Thesis: *Knowledge-Enhanced Natural Language Processing*. Graduation score: 5/5 (Excellent)."
          - "Areas of study: large language models, graph neural networks, retrieval-augmented generation, information extraction, semantic parsing."

      - institution: University of Bologna
        location: Cesena, Italy
        area: Computer Science and Engineering
        studyType: M.S.
        start_date: 2017
        end_date: 2020
        highlights:
          - "Graduation score: 110/110 cum Laude; cumulative GPA: 4.0."
          - "Thesis: *A New Unsupervised Methodology of Descriptive Text Mining for Knowledge Graph Learning* (supervisor: Gianluca Moro)."

      - institution: University of Bologna
        location: Cesena, Italy
        area: Computer Science and Engineering
        studyType: B.S.
        start_date: 2014
        end_date: 2017
        highlights:
          - "Graduation score: 110/110 cum Laude; cumulative GPA: 4.0."
          - "Thesis: *Design and development of a software system for studying and researching rare diseases* (supervisor: Dario Maio)."

    Experience:
      - company: University of Bologna, Department of Computer Science and Engineering
        position: Postdoctoral Research Fellow
        location: Cesena, Italy
        start_date: 2024-02
        end_date: 2027-01
        summary: >
          Research on representational and generative AI—including language models and graph neural
          networks—for clinical and biomedical applications, within the DARE project (National Plan
          for Complementary Investments to the PNRR; total budget €124M). Supervisor: Claudio Sartori.
          Research group: UniboNLP.

      - company: University of Glasgow, School of Computing Science (TerrierTeam)
        position: Postgraduate Visiting Researcher
        location: Glasgow, Scotland
        start_date: 2022-09
        end_date: 2022-12
        summary: >
          Combining language models and structured knowledge for natural language processing and
          understanding in biomedical domains. Supervisor: Zaiqiao Meng.

    "Research Projects":
      - bullet: >
          **AI Analysis for Risk Assessment of Empty Lymph Nodes in Endometrial Cancer Surgery**
          (2024–2026) — Co-Principal Investigator (scientific responsibility). Funded by Fondazione
          CARISBO ("Ricerca Scientifica e Alta Tecnologia 2024", €20K), with the University Hospital
          of Bologna IRCCS, Sant'Orsola Polyclinic.
      - bullet: >
          **Artificial Intelligence for Public Administrations Connected** (2023–2026) — Development of
          training and test-before-invest services focused on retrieval-augmented chatbots in
          low-resource regimes. Funded by the Ministry of Enterprises and Made in Italy
          (NextGenerationEU, Seal of Excellence; ~€5.8M) with SDA Bocconi, Maggioli Group, University
          of Milano-Bicocca, IFEL, and Tempo S.r.l.
      - bullet: >
          **DARE — Digital Lifelong Prevention** (2022–2026) — Research on language models and graph
          neural networks for health promotion and lifelong prevention. Funded by the Italian Ministry
          of University and Research under the National Plan for Complementary Investments to the PNRR
          (€124M).

    "Research Collaborations":
      - bullet: "**UniboNLP**, University of Bologna (2020–today) — primary research group, coordinated by Gianluca Moro; main expert on medical NLP and graph neural networks; co-management of the SLURM cluster infrastructure."
      - bullet: "**TerrierTeam**, University of Glasgow (2022–today) — knowledge injection into language models for biomedical question answering, with Zaiqiao Meng; co-organization of the KEIR workshop series at ECIR."
      - bullet: "**IBM Research Europe**, Dublin (2023–today) — zero-shot information extraction and multimodal fact checking, with Marcos Martínez Galindo, Alessandra Pascale, Javier Carnerero Cano, and James Barry."
      - bullet: "**EURECOM**, Data Science Department (2023–today) — multimodal fact checking, large language models, and databases, with Paolo Papotti."
      - bullet: "**Universidad Técnica Federico Santa María**, Chile (2024–today) — representation learning and natural language processing, with Ricardo Ñanculef."
      - bullet: "**University of Edinburgh**, School of Informatics (2026–today) — large language model reasoning, knowledge distillation, and board games, with Pasquale Minervini."

    "Scientific Service":
      - bullet: "**Guest Editor**, Sensors (Q1) — Special Issue *Role and Challenges of Healthcare Cognitive Computing: From Extraction to Data Analysis Techniques* (2025–2026)."
      - bullet: "**Workshop Co-Chair**, 2nd Workshop on Knowledge-Enhanced Information Retrieval (KEIR-25) @ ECIR-25, Lucca, Italy — proceedings published by Springer in LNCS, vol. 16086."
      - bullet: "**Workshop Publicity Chair**, 1st Workshop on Knowledge-Enhanced Information Retrieval (KEIR-24) @ ECIR-24, Glasgow, Scotland."
      - bullet: "**Session Chair** at AAAI-26 (Singapore, NLP 15), ECAI-25 (Bologna, NLP 7), and DATA-22 (Lisbon, Neural Network Applications)."
      - bullet: "**Area Chair / Action Editor**, ACL Rolling Review (Oct 2025, Jan 2026, May 2026) — 21 meta-reviews."
      - bullet: "**Reviewer** for international conferences (79 reviews), including NeurIPS, ICML, ICLR, AAAI, ACL ARR, EACL, AAMAS, ECAI, ECIR, ISWC, and ESWC."
      - bullet: "**Reviewer** for international journals (7 reviews), including Engineering Applications of Artificial Intelligence, Semantic Web Journal, and Expert Systems."

