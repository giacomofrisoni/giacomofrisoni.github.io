name: Update metrics (Scholar, DBLP, AMS Laurea)

# Runs every day at 05:17 UTC and on demand (Actions tab -> Run workflow).
# It refreshes assets/data/*.json, _data/metrics.yml and _data/citations.yml,
# appends new DBLP records to _bibliography/papers.bib,
# commits them, and then starts the "Deploy site" workflow. A commit pushed
# with GITHUB_TOKEN does not trigger other workflows by itself, while an
# explicit workflow_dispatch does, hence the last step.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      import_bib:
        description: "Append DBLP records that are missing from papers.bib"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: update-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pyyaml
      - name: Collect metrics
        env:
          # Optional: a SerpAPI key makes Google Scholar reliable on GitHub runners
          # (Settings -> Secrets and variables -> Actions -> New repository secret).
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.import_bib }}" = "false" ]; then ARGS="--no-import-bib"; fi
          python bin/update_metrics.py $ARGS
      - name: Commit changes
        id: commit
        run: |
          git config user.name  "metrics-bot"
          git config user.email "metrics-bot@users.noreply.github.com"
          git add assets/data _data/metrics.yml _data/citations.yml _bibliography/papers.bib
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update metrics $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
