  Terminal mode of giacomofrisoni.github.io
  ==========================================
  Interactive Unix-like terminal portfolio, rendered entirely client-side.

  Credits
  -------
  The structure and most of the code of this page (virtual filesystem, boot
  sequence, command router, bat/nano/vim renderers, tab completion, history,
  Konami-code easter egg) are adapted from "The Pirate's Den" by Andrea Amani
  aka Pinperepette:
    https://pinperepette.github.io/terminal.html
    https://github.com/Pinperepette/pinperepette.github.io
  Thank you, Andrea. Content, hostname, SLURM-flavoured commands, and colour
  scheme have been adapted to an academic NLP profile.

  Notes
  -----
  * Self-contained on purpose: inline CSS/JS so the al-folio build pipeline
    (PurgeCSS, terser) never touches it. `render_with_liquid: false` keeps

-->

    /* ============================================
       Amber-phosphor terminal theme
       (layout adapted from Pinperepette's styles.css)
       ============================================ */
    :root {
      --bg:      #0b0a08;
      --bg-alt:  #14110c;
      --fg:      #f2b63d;   /* amber phosphor */
      --dim:     #9a7529;
      --faint:   #4d3d18;
      --bright:  #ffd579;
      --accent:  #ffe4a3;
      --error:   #ff6b5c;
      --warn:    #ffb347;
      --info:    #8ecae6;
      --ok:      #9be36d;
      --sel:     rgba(242, 182, 61, 0.28);
      --mono:    'JetBrains Mono', ui-monospace, 'Cascadia Mono', 'Fira Code', 'Courier New', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 14px; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      line-height: 1.4;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--sel); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--dim); }

    .skip-link {
      position: absolute; left: -9999px; top: 0; z-index: 9999;
      padding: 0.5em 1em; background: var(--fg); color: var(--bg);
      font-weight: 700; text-decoration: none;
    }
    .skip-link:focus { left: 0; }

    /* ---- Terminal ---- */
    .terminal { padding: 16px 16px 40vh; min-height: 100vh; position: relative; }

    /* soft CRT vignette + scanlines */
    .terminal::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(242,182,61,0.03) 0%, transparent 70%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px, transparent 1px, transparent 3px);
      pointer-events: none;
      z-index: 9999;
    }
    @media (prefers-reduced-motion: reduce) { .terminal::before { background: none; } }

    .terminal-output { white-space: pre-wrap; word-wrap: break-word; }
    .terminal-line { min-height: 1.4em; color: var(--fg); }

    .terminal-ascii {
      color: var(--bright);
      font-size: 0.6rem;
      line-height: 1.1;
      text-shadow: 0 0 10px rgba(255, 213, 121, 0.35);
    }

    .text-bright  { color: var(--bright); font-weight: 700; }
    .text-dim     { color: var(--dim); }
    .text-faint   { color: var(--faint); }
    .text-accent  { color: var(--accent); font-weight: 700; }
    .text-error   { color: var(--error); }
    .text-warning { color: var(--warn); }
    .text-info    { color: var(--info); }
    .text-ok      { color: var(--ok); }

    .terminal-link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .terminal-link:hover, .terminal-link:focus { color: #fff3d1; }

    /* ---- Input line ---- */
    .input-line { display: flex; align-items: center; margin-top: 2px; }
    .prompt, .prompt-echo { color: var(--bright); font-weight: 700; white-space: nowrap; flex-shrink: 0; }
    .cmd-input {
      background: transparent; border: none; outline: none;
      color: var(--fg); font-family: var(--mono); font-size: 1rem;
      flex: 1; caret-color: var(--fg); padding: 0; margin: 0;
    }

    /* ---- Top bar: way back to the graphical site ---- */
    .topbar {
      position: fixed; top: 0; right: 0; z-index: 10000;
      display: flex; gap: 0.6em; padding: 6px 10px;
      font-size: 0.85rem; color: var(--dim);
      background: linear-gradient(to left, rgba(11,10,8,0.95), rgba(11,10,8,0));
    }
    .topbar a { color: var(--dim); text-decoration: none; }
    .topbar a:hover, .topbar a:focus { color: var(--bright); text-decoration: underline; }

    /* ---- bat (syntax-highlighted view) ---- */
    .bat-container { margin: 0.3em 0; border: 1px solid var(--faint); border-radius: 4px; overflow: hidden; }
    .bat-header {
      background: var(--bg-alt); padding: 0.3em 1em; color: var(--dim);
      border-bottom: 1px solid var(--faint); display: flex; justify-content: space-between;
    }
    .bat-header-file { color: var(--accent); font-weight: 700; }
    .bat-line { display: flex; line-height: 1.5; }
    .bat-line:hover { background: rgba(242,182,61,0.04); }
    .bat-gutter {
      color: var(--faint); text-align: right; padding: 0 0.8em 0 0.5em;
      user-select: none; min-width: 3em; border-right: 1px solid var(--faint); flex-shrink: 0;
    }
    .bat-content { padding: 0 0.8em; flex: 1; white-space: pre-wrap; word-wrap: break-word; }

    /* ---- Editors ---- */
    .editor-block { margin: 0.4em 0; line-height: 1.4; white-space: normal; display: block; }
    .editor-block .vim-content, .editor-block .nano-body { white-space: pre-wrap; }
    .nano-titlebar, .nano-shortcuts, .vim-statusline {
      background: #d9c08a; color: var(--bg); padding: 0 0.6em; font-weight: 700;
      display: flex; justify-content: space-between;
    }
    .nano-titlebar .nano-file { flex: 1; text-align: center; }
    .nano-titlebar .nano-mod { font-style: italic; }
    .nano-body { padding: 0.2em 0.4em; color: #d9c08a; }
    .nano-shortcuts { display: block; padding: 0 0.4em; }
    .nano-shortcuts .key { background: var(--bg); color: #d9c08a; padding: 0 0.2em; margin-right: 0.2em; }
    .vim-line { display: flex; line-height: 1.4; }
    .vim-gutter { color: var(--dim); text-align: right; padding-right: 0.8em; user-select: none; min-width: 3em; flex-shrink: 0; }
    .vim-content { flex: 1; white-space: pre-wrap; color: #d9c08a; }
    .vim-tilde { color: var(--info); }
    .vim-modeline { color: #d9c08a; padding: 0 0.4em; font-weight: 700; }
    .vim-modeline .vim-mode-tag { background: var(--bright); color: var(--bg); padding: 0 0.4em; margin-right: 0.6em; }

    /* ---- Syntax colours ---- */
    .syn-keyword { color: var(--error); font-weight: 700; }
    .syn-string  { color: var(--ok); }
    .syn-comment { color: var(--faint); font-style: italic; }
    .syn-number  { color: var(--warn); }
    .syn-heading { color: var(--bright); font-weight: 700; }
    .syn-bold    { color: var(--bright); font-weight: 700; }
    .syn-link    { color: var(--info); text-decoration: underline; }
    .syn-var     { color: var(--info); }
    .syn-flag    { color: var(--warn); }

    /* ---- Chess board ---- */
    .chess-board { line-height: 1.15; font-size: 1.05rem; }
    .chess-board .sq-w { color: var(--bright); }
    .chess-board .sq-b { color: var(--dim); }

    /* ---- Responsive ---- */
    @media (max-width: 768px) {
      html { font-size: 12px; }
      .terminal { padding: 8px 8px 40vh; }
      .terminal-ascii { font-size: 0.42rem; }
    }
    @media (max-width: 480px) {
      html { font-size: 11px; }
      .terminal-ascii { font-size: 0.32rem; }
    }
  </style>

    // Publication files are generated from the `papers` array so that the two never drift apart.
    function paperFile(title, types) {
      const list = papers.filter(p => types.includes(p.type));
      const lines = ['# ' + title + ' (' + list.length + ')', ''];
      for (const p of list) {
        lines.push('[' + p.n + '] ' + p.title);
        lines.push('    ' + p.authors + ' (' + p.year + '). ' + p.venue + (p.rank ? '. ' + p.rank : '') + '.');
        lines.push('');
      }
      return { type: 'file', content: lines };
    }
    filesystem[HOME + '/publications/conferences.txt'] = paperFile('Conference papers', ['conf']);
    filesystem[HOME + '/publications/journals.txt'] = paperFile('Journal articles', ['journal']);
    filesystem[HOME + '/publications/books-chapters.txt'] = paperFile('Books and book chapters', ['book', 'chapter']);
    filesystem[HOME + '/publications/workshops.txt'] = paperFile('Workshop and symposium papers', ['workshop']);
    filesystem[HOME + '/publications/preprints.txt'] = paperFile('Preprints', ['preprint']);

    const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const two = n => n.toString().padStart(2, '0');
    const clock = d => two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds());

    function addLine(text, cls) {
      const el = document.createElement('div');
      el.className = 'terminal-line' + (cls ? ' ' + cls : '');
      el.textContent = text;
      output.appendChild(el);
    }

    function addHTML(html, cls) {
      const el = document.createElement('div');
      el.className = 'terminal-line' + (cls ? ' ' + cls : '');
      el.innerHTML = html;
      output.appendChild(el);
    }

    function addAsciiLine(text) {
      const el = document.createElement('div');
      el.className = 'terminal-line terminal-ascii';
      el.textContent = text;
      output.appendChild(el);
    }

    function scrollToBottom() { window.scrollTo(0, document.body.scrollHeight); }
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function escapeRegex(str) { return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
    function link(url, label) {
      const safe = escapeHtml(url);
      return '<a href="' + safe + '" class="terminal-link" target="_blank" rel="noopener noreferrer">' + escapeHtml(label || url) + '</a>';
    }

    function resolvePath(path) {
      if (!path) return cwd;
      if (path === '~') return HOME;
      if (path.startsWith('~/')) return HOME + '/' + path.slice(2);
      if (path.startsWith('/')) return path;
      const base = cwd.endsWith('/') ? cwd : cwd + '/';
      const parts = (base + path).split('/').filter(p => p !== '' && p !== '.');
      const stack = [];
      for (const p of parts) { if (p === '..') stack.pop(); else stack.push(p); }
      return '/' + stack.join('/');
    }

    function getNode(path) {
      const clean = path.replace(/\/+$/, '') || '/';
      return filesystem[clean] || null;
    }

    function getDisplayCwd() {
      if (cwd === HOME) return '~';
      if (cwd.startsWith(HOME + '/')) return '~/' + cwd.slice(HOME.length + 1);
      return cwd;
    }

    function promptText() { return '[' + USER + '@' + HOST + ' ' + getDisplayCwd() + ']$ '; }
    function updatePrompt() { document.querySelector('.prompt').textContent = promptText(); }
    function echoPrompt(raw) { addHTML('<span class="prompt-echo">' + escapeHtml(promptText()) + '</span>' + escapeHtml(raw)); }

    function linkify(text) {
      return escapeHtml(text).replace(/(https?:\/\/[^\s<>"]+)/g, m => '<a href="' + m + '" class="terminal-link" target="_blank" rel="noopener noreferrer">' + m + '</a>');
    }

    /* ============================================
       COMMAND ROUTER
       ============================================ */
    function runCommand(raw) {
      if (raw.length > 500) { addLine('sh: command line too long (max 500 chars)'); scrollToBottom(); return; }
      const trimmed = raw.trim();
      const parts = trimmed.split(/\s+/);
      const cmd = parts[0];
      const args = parts.slice(1);

      echoPrompt(raw);
      if (!trimmed) { scrollToBottom(); return; }

      const handlers = {
        help: cmdHelp, ls: cmdLs, ll: a => cmdLs(['-lah', ...a]), cd: cmdCd, pwd: cmdPwd, cat: cmdCat, bat: cmdBat,
        head: cmdHead, tail: cmdTail, stat: cmdStat, find: cmdFind, tree: cmdTree,
        grep: cmdGrep, wc: cmdWc, echo: cmdEcho, which: cmdWhich, file: cmdFile,
        open: cmdOpen, 'xdg-open': cmdOpen,
        papers: cmdPapers, projects: cmdProjects, teaching: cmdTeaching, awards: cmdAwards,
        squeue: cmdSqueue, sinfo: cmdSinfo, sbatch: cmdSbatch, scancel: cmdScancel, 'nvidia-smi': cmdNvidiaSmi, module: cmdModule,
        df: cmdDf, du: cmdDu, ps: cmdPs, top: cmdTop, htop: cmdTop, free: cmdFree, uptime: cmdUptime,
        uname: cmdUname, env: cmdEnv, lscpu: cmdLscpu, crontab: cmdCrontab,
        ping: cmdPing, ssh: cmdSsh, mail: cmdMail, lynx: cmdLynx, w3m: cmdLynx, links: cmdLynx,
        nano: cmdNano, vim: cmdVim, vi: cmdVim, nvim: cmdVim,
        sh: cmdSh, bash: cmdSh, man: cmdMan, whoami: cmdWhoami, id: cmdId, hostname: cmdHostname,
        date: cmdDate, cal: cmdCal, clear: cmdClear, history: cmdHistory,
        fortune: cmdFortune, chess: cmdChess, credits: cmdCredits, exit: cmdExit, logout: cmdExit, gui: cmdExit,
      };

      if (trimmed.match(/^(sudo\s+)?rm\s+.*-rf|^(sudo\s+)?rm\s+-rf/)) { cmdRmRf(); }
      else if (handlers[cmd]) { handlers[cmd](args); }
      else if (cmd.startsWith('./')) { cmdSh([cmd.slice(2), ...args]); }
      else if (['mkdir','rmdir','rm','cp','mv','ln','chmod','chown','touch'].includes(cmd)) { addLine(cmd + ': permission denied (read-only home, this is a portfolio)'); }
      else if (cmd === 'sudo') { addLine(USER + ' is not in the sudoers file. This incident will be reported to the cluster admin (who is also ' + USER + ').'); }
      else if (cmd === 'su') { addLine('su: Authentication failure'); }
      else if (['wget','curl'].includes(cmd)) { addLine(cmd + ': network requests disabled on the login node. Try ssh <host> or lynx.'); }
      else if (cmd === 'emacs') { addLine('emacs: not installed. vim is right there.'); }
      else if (['python','python3'].includes(cmd)) {
        if (args.length && args[0].endsWith('.py')) { cmdSh(args); }
        else { addLine('Python 3.12.3 (unibonlp-login)'); addLine('>>> Not a real interpreter. Try ./train.sh for a (fake) training run instead.'); }
      }
      else if (cmd === 'pip') { addLine('ERROR: pip is disabled on the login node. Use a virtual environment on a compute node.'); }
      else if (['apt','yum','pacman','brew','conda'].includes(cmd)) { addLine(cmd + ': permission denied'); }
      else if (['reboot','shutdown','poweroff','halt'].includes(cmd)) { addLine(cmd + ': permission denied (and there are jobs running)'); }
      else if (cmd === 'git') { addLine('git: not a git repository (or any of the parent directories). The site itself is at ' + hosts.github.url + '/giacomofrisoni.github.io'); }
      else if (trimmed.includes(':(){ :|:& };:') || trimmed.includes(':(){ :|:&};:')) { addLine(''); addLine('Fork bomb detected. cgroups say no.', 'text-accent'); addLine(''); }
      else { addLine('sh: command not found: ' + cmd); addLine("Type 'help' for the list of commands.", 'text-dim'); }
      scrollToBottom();
    }

      for (const a of args) { if (!a.startsWith('-')) { target = resolvePath(a); break; } }

      if (dir.type === 'file') { addLine(target.split('/').pop()); return; }
      let items = [...dir.children].filter(i => hidden || !i.startsWith('.'));

    function detectLang(filename) {
      if (filename.endsWith('.sh') || filename.endsWith('.bashrc')) return 'Bash';
      if (filename.endsWith('.py')) return 'Python';
      if (filename.endsWith('.md')) return 'Markdown';
      if (filename.endsWith('.pdf')) return 'PDF';
      return 'Plain Text';

    function highlightSyntax(line, lang) {
      let h = escapeHtml(line);
      if (lang === 'Bash') {
        h = h.replace(/^(\s*)(#.*)$/, '$1<span class="syn-comment">$2</span>');
        h = h.replace(/(&quot;[^&]*&quot;)/g, '<span class="syn-string">$1</span>');
        h = h.replace(/\b(export|alias|echo|if|then|else|fi|for|do|done|module|source|exit|python)\b/g, '<span class="syn-keyword">$1</span>');
        h = h.replace(/(\$\w+|\$\{[^}]+\})/g, '<span class="syn-var">$1</span>');
        h = h.replace(/(\s)(--?\w[\w-]*)/g, '$1<span class="syn-flag">$2</span>');
      } else if (lang === 'Markdown') {
        if (h.match(/^#{1,6}\s/)) h = '<span class="syn-heading">' + h + '</span>';
        h = h.replace(/\*\*([^*]+)\*\*/g, '<span class="syn-bold">**$1**</span>');
        h = h.replace(/`([^`]+)`/g, '<span class="syn-string">`$1`</span>');
        h = h.replace(/(https?:\/\/[^\s<>"]+)/g, m => '<a href="' + m + '" class="terminal-link syn-link" target="_blank" rel="noopener noreferrer">' + m + '</a>');
      } else if (lang === 'Plain Text') {
        h = h.replace(/^(\s*)([A-Za-z][\w\s'-]*?)(:\s+)/, '$1<span class="syn-var">$2</span>$3');
        h = h.replace(/(https?:\/\/[^\s<>"]+)/g, m => '<a href="' + m + '" class="terminal-link syn-link" target="_blank" rel="noopener noreferrer">' + m + '</a>');
        h = h.replace(/\b(19|20)\d\d\b/g, '<span class="syn-number">$&</span>');
      }
      return h;
    }

    function cmdTree() {

          const isDir = k.endsWith('/');
          addHTML(escapeHtml(prefix + (last ? '└── ' : '├── ')) + (isDir ? '<span class="text-accent">' + escapeHtml(k) + '</span>' : escapeHtml(k)));
          if (isDir) walk(path + '/' + k.replace(/\/$/, ''), prefix + (last ? '    ' : '│   '));
        });

      addHTML('<span class="text-accent">' + escapeHtml(getDisplayCwd()) + '</span>');
      walk(cwd, '');

    function cmdGrep(args) {
      const flags = args.filter(a => a.startsWith('-'));

      if (rest.length < 2) { addLine('Usage: grep [-r] <pattern> <file|dir>'); return; }
      const pat = rest[0].toLowerCase();
      const target = resolvePath(rest[1]);
      const node = getNode(target);
      if (!node) { addLine('grep: ' + rest[1] + ': No such file or directory'); return; }
      const files = node.type === 'file' ? [[rest[1], node]] :
        Object.keys(filesystem).filter(k => k.startsWith(target + '/') && filesystem[k].type === 'file').map(k => ['.' + k.slice(HOME.length), filesystem[k]]);
      if (node.type === 'dir' && !flags.includes('-r')) { addLine('grep: ' + rest[1] + ': Is a directory (use -r)'); return; }
      const re = new RegExp('(' + escapeRegex(escapeHtml(pat)) + ')', 'gi');
      for (const [name, f] of files) {
        for (const line of f.content) {
          if (line.toLowerCase().includes(pat)) {
            addHTML((files.length > 1 ? '<span class="text-dim">' + escapeHtml(name) + ':</span>' : '') + escapeHtml(line).replace(re, '<span class="text-accent">$1</span>'));

        }
      }

    async function runTraining() {
      addLine('module load coffee          [ ok ]', 'text-dim');
      addLine('source .venv/bin/activate   [ ok ]', 'text-dim');
      addLine('Loading model: students (1 cohort, M.S. in Artificial Intelligence)', 'text-dim');
      addLine('Loading data: lectures + labs (tokenizers -> transformers -> LLMs -> RAG -> agents)', 'text-dim');
      await sleep(400);
      let loss = 3.42;
      const questions = ['"is the exam open book?"', '"can we use ChatGPT for the project?"', '"what is a token, exactly?"', '"is this like the Python course?"', '"do we need the GPU?"', '"can the deadline move?"'];
      for (let ep = 1; ep <= 3; ep++) {
        for (let step = 100; step <= 500; step += 100) {
          loss = Math.max(0.31, loss * (0.86 + Math.random() * 0.06));
          const acc = (0.41 + (ep - 1) * 0.14 + step / 5000 + Math.random() * 0.01).toFixed(3);
          addLine('epoch ' + ep + '/3  step ' + step.toString().padStart(4) + '/500  confusion ' + loss.toFixed(3) + '  can-explain-attention ' + acc + '  lr 3.0e-05  ' + (Math.random() * 2 + 1.2).toFixed(2) + ' students/s');
          if (step === 300) addLine('  [warn] question from the back row: ' + questions[Math.floor(Math.random() * questions.length)], 'text-warning');
          scrollToBottom();
          await sleep(140);
        }
        if (ep < 3) addLine('  checkpoint saved: exam-session-' + ep + ' (3 students asked "will this be on the exam?", as expected)', 'text-dim');
      }
      addLine('');
      addHTML('<span class="text-ok">Training complete.</span> Final exam accuracy: 0.871. Satisfaction: 4.5/5.');
      addLine('57 checkpoints so far in /home/frisoni/theses/. Next cohort starts in September.', 'text-dim');
    }

    /* ============================================
       INPUT HANDLING (history, tab completion)
       ============================================ */
    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const raw = cmdInput.value;
        if (raw.trim()) { commandHistory.push(raw.trim()); if (commandHistory.length > 100) commandHistory.shift(); historyIndex = commandHistory.length; }
        runCommand(raw);
        cmdInput.value = '';
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (historyIndex > 0) { historyIndex--; cmdInput.value = commandHistory[historyIndex]; }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (historyIndex < commandHistory.length - 1) { historyIndex++; cmdInput.value = commandHistory[historyIndex]; }
        else { historyIndex = commandHistory.length; cmdInput.value = ''; }
      } else if (e.key === 'Tab') {
        e.preventDefault();
        const val = cmdInput.value;
        const parts = val.split(/\s+/);
        if (parts.length <= 1) {
          const matches = [...new Set([...bins, 'll', 'logout', 'sudo'])].filter(c => c.startsWith(parts[0]));
          if (matches.length === 1) cmdInput.value = matches[0] + ' ';
          else if (matches.length > 1) { echoPrompt(val); addLine(matches.join('  ')); scrollToBottom(); }
        } else {
          const partial = parts[parts.length - 1];
          const slash = partial.lastIndexOf('/');
          const dirPart = slash >= 0 ? partial.slice(0, slash + 1) : '';
          const filePart = slash >= 0 ? partial.slice(slash + 1) : partial;
          const dir = getNode(resolvePath(dirPart || '.'));
          if (dir && dir.type === 'dir') {
            const matches = dir.children.filter(c => c.startsWith(filePart));
            if (matches.length === 1) { parts[parts.length - 1] = dirPart + matches[0]; cmdInput.value = parts.join(' ') + (matches[0].endsWith('/') ? '' : ' '); }
            else if (matches.length > 1) { echoPrompt(val); addLine(matches.join('  ')); scrollToBottom(); }
          }
        }
      } else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); output.innerHTML = ''; }
      else if (e.key === 'c' && e.ctrlKey && !window.getSelection().toString()) { echoPrompt(cmdInput.value + '^C'); cmdInput.value = ''; scrollToBottom(); }
    });

    // Keep the focus on the prompt: any key press (without modifiers) lands in the input.
    document.addEventListener('keydown', (e) => {
      if (inputLine.style.display !== 'none' && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) cmdInput.focus();
    });
    document.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      if (!window.getSelection().toString() && inputLine.style.display !== 'none') cmdInput.focus();
    });
    document.getElementById('topbar-help').addEventListener('click', (e) => { e.preventDefault(); if (inputLine.style.display !== 'none') { echoPrompt('help'); cmdHelp(); scrollToBottom(); } });

    /* ============================================
       KONAMI CODE -- token rain easter egg
       ============================================ */
    const konamiSequence = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
    let konamiIndex = 0;
    document.addEventListener('keydown', (e) => {
      if (e.key === konamiSequence[konamiIndex]) { konamiIndex++; if (konamiIndex === konamiSequence.length) { konamiIndex = 0; startTokenRain(); } }
      else konamiIndex = 0;
    });

    function startTokenRain() {
      if (document.getElementById('rain-canvas')) return;
      const canvas = document.createElement('canvas');
      canvas.id = 'rain-canvas';
      canvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9998;pointer-events:none;';
      document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      // Tokens that rain: ICD codes, SMILES-ish fragments, chess moves, subword pieces.
      const tokens = ['I10', 'E11', 'J18', 'N39', 'Z87', '[CLS]', '[SEP]', '##ing', '<s>', 'e4', 'Nf3', 'O-O', 'Qxd5', 'PubMed', 'UMLS', 'GNN', 'RAG', '▁the', '▁of', 'λ', 'σ', '∇', '0.781'];
      const fontSize = 14;
      const columns = Math.floor(canvas.width / (fontSize * 3));
      const drops = Array(columns).fill(1);
      let frames = 0;
      const maxFrames = 220;
      function draw() {
        ctx.fillStyle = 'rgba(11, 10, 8, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + 'px JetBrains Mono, monospace';
        for (let i = 0; i < drops.length; i++) {
          ctx.fillStyle = Math.random() > 0.97 ? '#fff3d1' : '#f2b63d';
          ctx.fillText(tokens[Math.floor(Math.random() * tokens.length)], i * fontSize * 3, drops[i] * fontSize);
          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        }
        frames++;
        if (frames < maxFrames) requestAnimationFrame(draw);
        else {
          canvas.style.transition = 'opacity 1s'; canvas.style.opacity = '0';
          setTimeout(() => canvas.remove(), 1000);
          addLine('');
          addLine('Tokens all the way down. Welcome to the embedding space.', 'text-accent');
          addLine('');
          scrollToBottom();
        }
      }
      draw();
    }

    document.addEventListener('DOMContentLoaded', runBootSequence);
  </script>
</body>
